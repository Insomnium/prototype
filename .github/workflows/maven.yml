# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "*" ]
    types:
      - opened
      - reopened
      - edited
      - synchronize

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Verify with maven
      run: |
        cd backend
        mvn clean verify

    - name: Generate JaCoCo coverage badge
      id: jacoco
      uses: cicirello/jacoco-badge-generator@v2
      with:
        jacoco-csv-file: >
          backend/core/target/site/jacoco/jacoco.csv
          backend/chat/target/site/jacoco/jacoco.csv
        generate-branches-badge: true
        badges-directory: .github/badges

    - name: Log Coverage Percentages
      run: |
        echo "Instructions Coverage: ${{ steps.jacoco.outputs.coverage }}"
        echo "Branches Coverage: ${{ steps.jacoco.outputs.branches-coverage }}"

    - name: Commit and Push Badges
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        if [ -n "$(git status --porcelain)" ]; then
            git pull --rebase origin HEAD:${{ github.head_ref || github.ref_name }}
            git add .
            git commit -m "chore: auto badge update"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
        else
            echo "No changes detected. Skipping push."
        fi
